# Theorems from papers uploaded to the Thrust 2 review site become open nodes of the DAG.
#
#   pull    every 15 minutes: add new paper theorems as open nodes (dagtool pull-papers)
#   verify  the usual verify run, which publishes dag.json for the site
#
# Nothing here writes proofs. Proposals for open theorems are made elsewhere (for example from Quantum Genesis
# dashboard tickets) and arrive as pull requests under proposals/, which the `proposals` workflow checks.
# Repository variable: MODULUS_URL (site address).
name: papers

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: papers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dag-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      added: ${{ steps.pull.outputs.added }}
    env:
      MODULUS_URL: ${{ vars.MODULUS_URL || 'https://genesis-thrust2-review.fly.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          packages: light
          lean: "false"

      - name: Pull open paper theorems
        id: pull
        run: |
          # the site's machine may be waking up (Fly auto-stops it): retry before giving up
          for i in 1 2 3; do
            if dagtool pull-papers --server "$MODULUS_URL"; then break; fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 30
          done
          dagtool validate
          git add -A dag/nodes/papers
          if git diff --cached --quiet; then
            echo "added=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(git diff --cached --name-only | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add $n paper theorem(s) from the review site [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "added=$n" >> "$GITHUB_OUTPUT"

  verify:
    needs: pull
    if: ${{ !cancelled() && needs.pull.outputs.added != '0' }}
    uses: ./.github/workflows/verify.yml
    with:
      rerun: stale
