id: def.transverse_ising_triangular
kind: definition
title: Transverse-field Ising model on an N×N triangular lattice
statement: H = Σ_⟨j,k⟩ Z_j Z_k + 0.1 Σ_j X_j on an N×N triangular lattice with open boundaries and evolution time
  t = 1 (Eq. 24 of arXiv:2406.06015v3), built as pyLIQTR 1.3.3 Heisenberg(shape=(N, N), J=(0, 0, 1), h=(0.1, 0,
  0), cell=TriangularLattice) with the PauliLCU block encoding (§III.3).
