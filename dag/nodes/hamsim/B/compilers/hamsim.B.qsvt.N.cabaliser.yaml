id: hamsim.B.qsvt.N.cabaliser
kind: theorem
layer: B
title: QSVT N formula (Cabaliser)
statement: |
  Compiling the QSVT circuit for n ≥ 2 data qubits with Cabaliser, with odd D ≥ 3, gives a graph state with N = (36n − 18)D + 92n − 20 vertices.
statement_tex: N = (36n - 18)D + 92n - 20
description: |
  The same circuit as the Graphix nodes (Qiskit transpile, level 1, here to Clifford + Rz with Rz by multiples of π/2 passed as Cliffords), compiled by Cabaliser in one widget with its inputs teleported in. The Graphix-optimized formula (hamsim.B.qsvt.N.opt) holds for Cabaliser too, exactly on the grid: both compilers end with one measured vertex per non-Clifford rotation, so they agree on N. Counts are recorded by experiments/compilers/run.py in the pinned RRE environment (Cabaliser 10f5c4e).
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/hamsim/analysis.py, src/mbqc_verify/compilers/__init__.py, src/mbqc_verify/compilers/cabaliser.py,
  experiments/compilers/results/cabaliser.json]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: qsvt_calls_per_sequence, compiler: cabaliser}
depends_on:
- {node: hamsim.B.qsvt.N.opt, kind: variant_of}
- {node: hamsim.B.cabaliser_graphs_match, kind: uses}
checks:
- test: scaling/bilinear_formula
  params:
    method: qsvt
    compiler: cabaliser
    quantity: N
    coef: [36, -18, 92, -20]
- test: mutation/scaling_coefficients
tags: [hamsim, qsvt, resources, cabaliser, compiler-variant]
