id: hamsim.B.slide.N_Q
kind: theorem
layer: B
title: 'Slide: QSVT vertices formula'
statement: |
  The slide's compiler gives N_Q = (36n − 18)d + 14n + 23, for n ≥ 2 and odd degree ≥ 3 (its d_ε, g_ε).
statement_tex: N_Q = (36n-18)d + 14n + 23
description: |
  A claim about a compiler we do not have, so no check can run; it enters Layer C only as an explicit assumption. Our optimized QSVT has the same per-degree cost 36n − 18 but a different setup term (92n − 20).
