id: hamsim.B.trotter2.M.opt
kind: theorem
layer: B
title: second-order Trotter M formula (Graphix-optimized)
statement: |
  Compiling the second-order Trotter circuit for n ≥ 2 data qubits after standardizing and removing Pauli measurements (Graphix-optimized), with r ≥ 1, gives a pattern with M = (3n − 1)r + 2n measurements.
statement_tex: M = (3n - 1)r + 2n
lean_decl: MBQC.Results.HamSim.trotter2_measurements_opt
description: |
  Optimization trades vertices for memory: peak live qubits rise from about 10–22 to 55–991 on the grid.
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: trotter_steps, compiler: graphix_opt}
depends_on:
- {node: transfer.gate_to_mbqc, kind: instantiates}
- {node: lemma.bilinear_interpolation, kind: uses}
- {node: assume.hamsim.trotter2_opt_M, kind: assumes}
checks:
- test: scaling/bilinear_formula
  params:
    method: trotter2
    compiler: graphix_opt
    quantity: M
    coef: [3, -1, 2, 0]
- test: mutation/scaling_coefficients
- test: lean/proof
- test: vocabulary/vetted_constants
- test: nonvacuity/witness
  params: {witness: MBQC.Results.HamSim.trotter2_measurements_opt_nonvacuous}
tags: [hamsim, trotter2, resources, Graphix-optimized]
