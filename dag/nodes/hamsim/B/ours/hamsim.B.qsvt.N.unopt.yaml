id: hamsim.B.qsvt.N.unopt
kind: theorem
layer: B
title: QSVT N formula (unoptimized)
statement: |
  Compiling the QSVT circuit for n ≥ 2 data qubits gate by gate (unoptimized), with odd D ≥ 3, gives a pattern with N = (294n − 144)D + 362n − 30 vertices.
statement_tex: N = (294n - 144)D + 362n - 30
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compile/qiskit_to_mbqc.py, src/mbqc_verify/hamsim/analysis.py]
