id: hamsim.B.qsvt.N.unopt
kind: theorem
layer: B
title: QSVT N formula (unoptimized)
statement: |
  Compiling the QSVT circuit for n ≥ 2 data qubits gate by gate (unoptimized), with odd D ≥ 3, gives a pattern with N = (294n − 144)D + 362n − 30 vertices.
statement_tex: N = (294n - 144)D + 362n - 30
lean_decl: MBQC.Results.HamSim.qsvt_vertices_unopt
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: qsvt_calls_per_sequence, compiler: graphix}
depends_on:
- {node: transfer.gate_to_mbqc, kind: instantiates}
