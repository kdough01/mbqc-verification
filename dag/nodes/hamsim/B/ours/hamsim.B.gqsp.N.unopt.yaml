id: hamsim.B.gqsp.N.unopt
kind: theorem
layer: B
title: GQSP N formula (unoptimized)
statement: |
  Compiling the GQSP circuit for n ≥ 2 data qubits gate by gate (unoptimized), with d ≥ 1, gives a pattern with N = (436n − 244)d + 4n + 10 vertices.
statement_tex: N = (436n - 244)d + 4n + 10
lean_decl: MBQC.Results.HamSim.gqsp_vertices_unopt
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: gqsp_laurent_degree, compiler: graphix}
depends_on:
- {node: transfer.gate_to_mbqc, kind: instantiates}
