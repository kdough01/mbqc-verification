id: hamsim.B.gqsp.N.unopt
kind: theorem
layer: B
title: GQSP N formula (unoptimized)
statement: |
  Compiling the GQSP circuit for n ≥ 2 data qubits gate by gate (unoptimized), with d ≥ 1, gives a pattern with N = (436n − 244)d + 4n + 10 vertices.
statement_tex: N = (436n - 244)d + 4n + 10
