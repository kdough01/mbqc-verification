id: hamsim.B.gqsp.E.unopt
kind: theorem
layer: B
title: GQSP E formula (unoptimized)
statement: |
  Compiling the GQSP circuit for n ≥ 2 data qubits gate by gate (unoptimized), with d ≥ 1, gives a pattern with E = (532n − 300)d + 12 CZ edges.
statement_tex: E = (532n - 300)d + 12
lean_decl: MBQC.Results.HamSim.gqsp_edges_unopt
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: gqsp_laurent_degree, compiler: graphix}
depends_on:
