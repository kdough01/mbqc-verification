  params:
    method: gqsp
    optimize: false
    quantity: E
    coef: [532, -300, 0, 12]
- kind: mutation
  params: {target: scaling}
- kind: differential
  params: {method: gqsp}
tags: [hamsim, gqsp, resources, unoptimized]
