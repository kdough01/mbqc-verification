id: hamsim.B.qsvt.E.unopt
kind: theorem
layer: B
title: QSVT E formula (unoptimized)
statement: |
  Compiling the QSVT circuit for n ≥ 2 data qubits gate by gate (unoptimized), with odd D ≥ 3, gives a pattern with E = (378n − 180)D + 418n − 31 CZ edges.
statement_tex: E = (378n - 180)D + 418n - 31
lean_decl: MBQC.Results.HamSim.qsvt_edges_unopt
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compile/qiskit_to_mbqc.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: qsvt_calls_per_sequence, compiler: graphix}
