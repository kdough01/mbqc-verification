id: hamsim.B.gqsp.E.opt
kind: theorem
layer: B
title: 'GQSP: optimized E has no bilinear formula'
statement: |
  Compiling the GQSP circuit and then after standardizing and removing Pauli measurements, the number of CZ edges E is not of the form (an + b)d + cn + e for any rationals a, b, c, e.
description: |
  Removing Pauli measurements rewires edges by local complementation, so the CZ count depends on the graph's details. The scaling check exhibits grid points no bilinear formula can fit.
  Optimization trades vertices for memory: peak live qubits rise from about 10–22 to 55–991 on the grid.
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compile/qiskit_to_mbqc.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: gqsp_laurent_degree}
depends_on:
- {node: transfer.gate_to_mbqc, kind: instantiates}
- {node: def.resource_counts, kind: uses}
checks:
- kind: scaling
  params: {method: gqsp, optimize: true, quantity: E, claim: not_bilinear}
tags: [hamsim, gqsp, resources, optimized]
