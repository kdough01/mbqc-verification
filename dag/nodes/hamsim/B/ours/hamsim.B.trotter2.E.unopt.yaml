id: hamsim.B.trotter2.E.unopt
kind: theorem
layer: B
title: second-order Trotter E formula (unoptimized)
statement: |
  Compiling the second-order Trotter circuit for n ≥ 2 data qubits gate by gate (unoptimized), with r ≥ 1, gives a pattern with E = (12n − 8)r + 2n CZ edges.
statement_tex: E = (12n - 8)r + 2n
lean_decl: MBQC.Results.HamSim.trotter2_edges_unopt
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compile/qiskit_to_mbqc.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: trotter_steps, compiler: graphix}
