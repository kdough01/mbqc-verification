id: hamsim.B.qsvt.M.unopt
kind: theorem
layer: B
title: QSVT M formula (unoptimized)
statement: |
  Compiling the QSVT circuit for n ≥ 2 data qubits gate by gate (unoptimized), with odd D ≥ 3, gives a pattern with M = (294n − 144)D + 358n − 31 measurements.
statement_tex: M = (294n - 144)D + 358n - 31
lean_decl: MBQC.Results.HamSim.qsvt_measurements_unopt
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compile/qiskit_to_mbqc.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: qsvt_calls_per_sequence, compiler: graphix}
depends_on:
- {node: transfer.gate_to_mbqc, kind: instantiates}
- {node: def.jcz_construction, kind: uses}
- {node: def.graphix_gates, kind: uses}
- {node: transfer.gate_counts, kind: uses}
- {node: transfer.gate_to_mbqc_counts, kind: uses}
- {node: assume.hamsim.qsvt_unopt_gates, kind: assumes}
