id: hamsim.B.gqsp.M.opt
kind: theorem
layer: B
title: GQSP M formula (Graphix-optimized)
statement: |
  Compiling the GQSP circuit for n ≥ 2 data qubits after standardizing and removing Pauli measurements (Graphix-optimized), with d ≥ 1, gives a pattern with M = (80n − 40)d + 4n + 2 measurements.
statement_tex: M = (80n - 40)d + 4n + 2
lean_decl: MBQC.Results.HamSim.gqsp_measurements_opt
description: |
  Optimization trades vertices for memory: peak live qubits rise from about 10–22 to 55–991 on the grid.
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: gqsp_laurent_degree, compiler: graphix_opt}
depends_on:
- {node: transfer.gate_to_mbqc, kind: instantiates}
- {node: lemma.bilinear_interpolation, kind: uses}
- {node: assume.hamsim.gqsp_opt_M, kind: assumes}
checks:
- test: scaling/bilinear_formula
  params:
    method: gqsp
    compiler: graphix_opt
    quantity: M
    coef: [80, -40, 4, 2]
- test: mutation/scaling_coefficients
- test: lean/proof
- test: vocabulary/vetted_constants
- test: nonvacuity/witness
  params: {witness: MBQC.Results.HamSim.gqsp_measurements_opt_nonvacuous}
tags: [hamsim, gqsp, resources, Graphix-optimized]
