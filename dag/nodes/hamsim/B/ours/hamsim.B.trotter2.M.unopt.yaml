id: hamsim.B.trotter2.M.unopt
kind: theorem
layer: B
title: second-order Trotter M formula (unoptimized)
statement: |
  Compiling the second-order Trotter circuit for n ≥ 2 data qubits gate by gate (unoptimized), with r ≥ 1, gives a pattern with M = (10n − 6)r + 2n measurements.
statement_tex: M = (10n - 6)r + 2n
lean_decl: MBQC.Results.HamSim.trotter2_measurements_unopt
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: trotter_steps, compiler: graphix}
depends_on:
- {node: transfer.gate_to_mbqc, kind: instantiates}
- {node: def.jcz_construction, kind: uses}
- {node: def.graphix_gates, kind: uses}
- {node: transfer.gate_counts, kind: uses}
- {node: transfer.gate_to_mbqc_counts, kind: uses}
- {node: assume.hamsim.trotter2_unopt_gates, kind: assumes}
checks:
- test: scaling/bilinear_formula
  params:
    method: trotter2
    compiler: graphix
    quantity: M
    coef: [10, -6, 2, 0]
- test: mutation/scaling_coefficients
- test: differential/lean_counts
