id: hamsim.C.ours.d_ge_g.E.unopt
kind: theorem
layer: C
title: Slide's claim with our unoptimized E
statement: |
  With our unoptimized compilation, for all n ≥ 2 and degrees D ≥ d (QSVT degree D odd): QSVT's CZ edges E exceed GQSP's.
description: |
  The slide's conclusion re-tested on our compiler. Note the comparison pairs our QSVT D (calls per sequence) with our GQSP d (Laurent degree): the convention check flags it, because the two degrees measure different things. The equal-accuracy comparison avoids this. Lean disproves it too: at n = 2, D = d = 5 the Layer B formulas give QSVT fewer edges than GQSP.
lean_decl: MBQC.Results.HamSim.qsvt_gqsp_edges_unopt_disproof
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {degree: qsvt_calls_per_sequence}
depends_on:
- {node: hamsim.B.qsvt.E.unopt, kind: uses}
- {node: hamsim.B.gqsp.E.unopt, kind: uses}
checks:
- test: refuter/qsvt_exceeds_gqsp_formulas
  params: {quantity: E, qsvt: hamsim.B.qsvt.E.unopt, gqsp: hamsim.B.gqsp.E.unopt, n_max: 50, k_max: 41}
- test: lean/disproof
- test: vocabulary/vetted_constants
acknowledged:
- {code: convention_mismatch, reason: 'the slide''s claim compares degrees directly, so re-testing it on our compiler has
    to pair our QSVT D with our GQSP d; hamsim.C.equal_accuracy is the convention-free comparison'}
- {code: refuted, reason: 'this re-tests the slide''s conclusion on our compiler, where we expect it to fail'}
tags: [hamsim, consequence, unoptimized]
