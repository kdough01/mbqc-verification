id: hamsim.C.slide.d_ge_g.N
kind: theorem
layer: C
title: 'Slide''s claim: d ≥ g ⇒ QSVT uses more vertices'
statement: |
  With the slide's formulas, for all n ≥ 2 and odd d ≥ g ≥ 3: N_Q(n, d) > N_G(n, g).
statement_tex: \forall n\ge 2,\; d \ge g \ge 3 \text{ odd}:\; N_Q(n,d) > N_G(n,g)
description: Pure algebra on the slide's formulas as printed. Proved in Lean by writing the difference
  as a sum of products of nonnegative factors; sympy finds the same certificate independently.\n
