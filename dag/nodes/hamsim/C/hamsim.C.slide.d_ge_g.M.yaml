id: hamsim.C.slide.d_ge_g.M
kind: theorem
layer: C
title: 'Slide''s claim: d ≥ g ⇒ QSVT uses more measurements'
statement: |
  With the slide's formulas (M = N − n), for all n ≥ 2 and odd d ≥ g ≥ 3: M_Q(n, d) > M_G(n, g).
statement_tex: \forall n\ge 2,\; d \ge g \ge 3 \text{ odd}:\; M_Q(n,d) > M_G(n,g)
description: Pure algebra on the slide's formulas as printed. Proved in Lean by writing the difference
  as a sum of products of nonnegative factors; sympy finds the same certificate independently.\n
lean_decl: MBQC.Results.HamSim.slide_d_ge_g_M
