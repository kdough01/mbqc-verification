id: hamsim.A.trotter1_accuracy
kind: theorem
layer: A
title: First-order Trotter reaches accuracy ε
statement: |
  For the Ising chain, t > 0 and 0 < ε < 1, order-1 Trotter with r = ⌈t² ‖[A, B]‖ / (2ε)⌉ steps satisfies ‖S1(t/r)^r − e^{−iHt}‖ ≤ ε.
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/hamsim/qsp_angles.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: radians, endian: little, input: zero, phase: exact, degree: trotter_steps}
depends_on:
- {node: def.hamsim.ising_chain, kind: uses}
- {node: hamsim.A.trotter_circuit_matches_formula, kind: uses}
- {node: assume.trotter_commutator_bound, kind: assumes}
checks:
- kind: numerical
  params: {which: accuracy, method: trotter1}
tags: [hamsim, trotter, accuracy]
