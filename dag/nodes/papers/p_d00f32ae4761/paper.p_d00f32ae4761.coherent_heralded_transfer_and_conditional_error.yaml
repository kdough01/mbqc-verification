title: Coherent heralded transfer and conditional error
statement: 'In particular, replacing every factor by a forward controlled walk would implement the wrong
  evolution.


  The corrected MBQC pattern above implements that approximate circuit on every measurement branch.


  Telescoping products of unitary gates bound circuit error by the sum of gate errors.'
