title: 'Runtime model: tocks, delays, and handover'
statement: 'The factor of 8 arises because, in our architecture, each surface code sweep for stabilizer
  syndrome extraction circuits requires at most one initialization


  We must introduce a delay if we require more magic states than were accumulated on the T-transfer bus
  during the prior preparation step


  We must incur a cost if FTQC needs to teleport graph nodes vertically within the same leg


  we consider a characteristic decoder cycle time of tdecoder = 1 µs'
