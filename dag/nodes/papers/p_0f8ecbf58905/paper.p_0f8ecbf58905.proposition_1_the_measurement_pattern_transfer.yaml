title: 'Proposition 1: the measurement-pattern transfer'
statement: 'replacing all elementary gates of the complete QSP circuit by the corrected patterns (4) and
  CZ implements the same successful-branch operator


  For a pure MBQC realization, assume finite coherent circuits for the controlled OH, OF and their inverses,
  including scratch initialization and cleanup.


  Physical failure is a separate probability, bounded by a union bound below; it is not an interchangeable
  precision parameter.'
