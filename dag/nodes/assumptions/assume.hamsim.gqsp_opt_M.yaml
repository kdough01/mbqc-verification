id: assume.hamsim.gqsp_opt_M
kind: assumption
title: 'Graphix-optimized GQSP measurement counts: structure and corners'
statement: |
  Let M(n, d) be the measurement count of the Graphix-optimized GQSP pattern (n ≥ 2, d ≥ 1). (i) M(n, d + 1) − M(n, d) does not depend on d; (ii) M(n + 1, d) − M(n, d) does not depend on n; (iii) M(2, 1) = 130, M(2, 2) = 250, M(3, 1) = 214, M(3, 2) = 414.
description: |
  What Lean cannot compute: facts about Graphix's output, stated as the axioms of MBQC.Assumptions.HamSim.GqspOptM (lean/MBQC/Assumptions/HamSimOpt.lean). The scaling check counts the real patterns on the whole grid, held-out points included. A reviewer should judge whether (i) and (ii) are plausible for the Graphix-optimized (Pauli-removed) pattern beyond the grid.
lean_decl: [MBQC.Assumptions.HamSim.GqspOptM]
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: gqsp_laurent_degree, compiler: graphix_opt}
depends_on:
- {node: def.resource_counts, kind: uses}
checks:
- test: scaling/bilinear_formula
  params:
    method: gqsp
    compiler: graphix_opt
    quantity: M
    coef: [80, -40, 4, 2]
tags: [hamsim, gqsp, resources, Graphix-optimized]
