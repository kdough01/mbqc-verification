id: assume.hamsim.qsvt_unopt_gates
kind: assumption
title: 'Transpiled QSVT circuit: gate counts'
statement: |
  For n ≥ 2 data qubits and odd D ≥ 3, the QSVT circuit after Qiskit's transpiler (level 1, Graphix's gate set) acts on 4n + 1 qubits and has CNOT = (75n − 36)D − 3n + 12; CZ = (9n − 6)D − 9n + 6; RZZ = 3D + 3; CCX = 12n − 4; H = 4n + 3; X = 1; RY = (36n − 24)D; RZ = 3D + 3; U = 9 gates (every other kind: none), and no CZ of its J/CZ stream cancels an edge.
description: |
  What Lean cannot compute: what Qiskit's transpiler outputs. Stated as the axioms of MBQC.Assumptions.HamSim.QsvtUnoptGates (lean/MBQC/Assumptions/HamSimGates.lean). The scaling checks count every gate kind of the real transpiled circuits on the whole grid, held-out points included, and check the qubit count and that no CZ cancels. A reviewer should judge whether exact bilinear gate counts are plausible beyond the grid: the circuit repeats one block per D, and each block grows linearly in n.
lean_decl: [MBQC.Assumptions.HamSim.QsvtUnoptGates]
code: [src/mbqc_verify/hamsim/circuits.py, src/mbqc_verify/compilers/graphix.py, src/mbqc_verify/hamsim/analysis.py]
conventions: {angle: pi_units, endian: big, input: plus, phase: global_dropped, degree: qsvt_calls_per_sequence, compiler: graphix}
depends_on:
- {node: def.graphix_gates, kind: uses}
checks:
- test: scaling/gate_counts
  name: gates-cnot
  params:
    method: qsvt
    gate: cnot
    coef: [75, -36, -3, 12]
- test: scaling/gate_counts
  name: gates-cz
  params:
    method: qsvt
    gate: cz
    coef: [9, -6, -9, 6]
- test: scaling/gate_counts
  name: gates-rzz
  params:
    method: qsvt
    gate: rzz
    coef: [0, 3, 0, 3]
- test: scaling/gate_counts
  name: gates-ccx
  params:
    method: qsvt
    gate: ccx
    coef: [0, 0, 12, -4]
- test: scaling/gate_counts
  name: gates-h
  params:
    method: qsvt
    gate: h
    coef: [0, 0, 4, 3]
- test: scaling/gate_counts
  name: gates-x
  params:
    method: qsvt
    gate: x
    coef: [0, 0, 0, 1]
- test: scaling/gate_counts
  name: gates-rx
  params:
    method: qsvt
    gate: rx
    coef: [0, 0, 0, 0]
- test: scaling/gate_counts
  name: gates-ry
  params:
    method: qsvt
    gate: ry
    coef: [36, -24, 0, 0]
- test: scaling/gate_counts
  name: gates-rz
  params:
    method: qsvt
    gate: rz
    coef: [0, 3, 0, 3]
- test: scaling/gate_counts
  name: gates-u
  params:
    method: qsvt
    gate: u
    coef: [0, 0, 0, 9]
- test: scaling/circuit_width
  name: width
  params:
    method: qsvt
    coef: [0, 0, 4, 1]
- test: scaling/no_cancel
  name: no-cancel
  params: {method: qsvt}
tags: [hamsim, qsvt, resources, unoptimized, gate-counts]
