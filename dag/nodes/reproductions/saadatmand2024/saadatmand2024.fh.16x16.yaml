id: saadatmand2024.fh.16x16
kind: theorem
title: 'Fermi–Hubbard 16×16: Table II resources'
statement: 'Fermi–Hubbard 16×16 on the paper''s modular superconducting architecture needs: ñ_logical 578; logical
  bus patches 2.31k; T patches 1.25k; allocated physical qubits 3.30M; modules 4; hardware time 6.9h; P_diss,4K
  1.68kW; P_diss,20mK 336nW; energy 8.11MWh (Table II of arXiv:2406.06015v3).'
description: For the larger machine (experiments/rre/README.md, 'Larger instances'); its checks skip until the results
  file is committed.
code:
- experiments/rre/fh.py
- experiments/rre/compare.py
- experiments/rre/reproduce_table2.py
- experiments/rre/paper_v3_table2.yaml
- experiments/rre/config_calibrated.yaml
depends_on:
- node: def.fermi_hubbard_square
  kind: uses
- node: saadatmand2024.config
  kind: assumes
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II, Fermi–Hubbard row 16x16
checks:
- test: reproduction/recorded_value
  name: reproduction-n-logical
  params:
    results: experiments/rre/results/calibrated/table2_fh_16x16.json
    path: quantities.n_logical.ours
    expect:
      path: quantities.n_logical.paper
    op: approx
    rel_tol: 0.01
    domain: Fermi–Hubbard 16×16, RRE 0.26.33 @ 9383b4d, config_calibrated.yaml, RRE's example widgetizer, FIFO ancilla reuse
