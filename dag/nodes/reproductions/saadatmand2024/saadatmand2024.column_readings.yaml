id: saadatmand2024.column_readings
kind: lemma
title: What Table II's columns count
statement: Table II's ñ_logical column is the input circuit's logical qubits (Parameter 15), not the graph memory
  of Appendix A's Parameter 2; its T-patch column counts the T-transfer bus and factory patches over all modules;
  and its physical-qubit column is modules × Parameter 14 (factories at their Q qubits), not Parameter 35, which
  RRE reports as total_allocated_physical_qubits.
description: 'Settled on the QFT rows, which have no circuit ambiguity: with these readings QFT N-4, N-10 and N-100
  (two and four modules) reproduce exactly, and with any of the first-pass readings they do not. Fermi–Hubbard 4×4
  gives ñ_logical = 74 with FIFO ancilla reuse.'
code:
- experiments/rre/compare.py
- experiments/rre/reproduce_table2.py
- experiments/rre/results/calibrated/table2_qft_N-4.json
- experiments/rre/results/calibrated/table2_qft_N-10.json
- experiments/rre/results/calibrated/table2_qft_N-100.json
- experiments/rre/results/calibrated/table2_fh_4x4.json
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II header; Appendix A, Parameters 2, 14, 15, 35
checks:
- test: reproduction/recorded_value
  name: qft-n-4-n-logical
