id: saadatmand2024.fh.8x8
kind: theorem
title: 'Fermi–Hubbard 8×8: Table II resources'
statement: 'QSP Hamiltonian simulation of the 8×8 Fermi–Hubbard model (t = 1, ε_qsp = 0.025) on the paper''s modular
  superconducting architecture needs: ñ_logical 182; logical bus patches 728; T patches 2.07k; allocated physical
  qubits 1.38M; modules 2; hardware time 9.49 min; P_diss,4K 840 W; P_diss,20mK 168 nW; energy 93 kWh (Table II
  of arXiv:2406.06015v3).'
description: Too large for CI; run on the larger machine (experiments/rre/README.md, 'Larger instances'). Until
  then its checks skip.
code:
- experiments/rre/fh.py
- experiments/rre/compare.py
- experiments/rre/paper_v3_table2.yaml
- experiments/rre/config_paper_v3.yaml
depends_on:
- node: def.fermi_hubbard_square
  kind: uses
- node: saadatmand2024.config
  kind: assumes
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II, Fermi Hubbard row 8x8
checks:
- kind: reproduction
  name: reproduction-n-logical
  params:
    results: experiments/rre/results/table2_8x8.json
    path: quantities.n_logical.ours
    expect:
      path: quantities.n_logical.paper
    op: approx
    rel_tol: 0.01
    domain: FH 8x8, RRE 0.26.33 @ 9383b4d, pyLIQTR 1.3.3, config_paper_v3.yaml, default widgetization
- kind: reproduction
