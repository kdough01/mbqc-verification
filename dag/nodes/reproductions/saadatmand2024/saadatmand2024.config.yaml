id: saadatmand2024.config
kind: assumption
title: The paper's architecture configuration (stated, and as calibrated)
statement: 'Stated in the paper: physical error rate p = 1e-3; per-cycle logical error p_C = κ (p/p_th)^((d+1)/2)
  with κ = 0.009, p_th = 0.016 (MWPM fit); mixed-fallback gate synthesis L_ε = ⌈0.57 log2(1/ε) + 8.83⌉; 1,000,000
  physical qubits per module; inter-module handover and decoder timescales 1 µs; success probability p_algo = 0.95;
  ε_qsp = 0.025. Settled by calibration on the QFT rows (not stated): failure budget 0.05, RRE''s shipped T-factory
  table, gate time t = 200 ns, QFT circuits compiled as a single widget.'
description: 'experiments/rre/config_paper_v3.yaml is the first pass (failure budget read as 0.95, Table I as printed);
  experiments/rre/config_calibrated.yaml is the configuration the QFT rows single out (saadatmand2024.calibration).
  Still not stated: widgetization and ancilla allocation for Fermi–Hubbard and Ising.'
code:
- experiments/rre/config_paper_v3.yaml
- experiments/rre/config_calibrated.yaml
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: §II.3–II.4.7, Eqs. (1)–(22), Table I, Appendix A (Parameters 16, 27–29), Appendix D (κ = 0.009, p_th
    = 0.016), §III.2.3 Eq. (27)
  convention_map: 'RRE params.yaml keys: error_scaling_coeffs.k/p_th, phys_gate_error_rate, 1q_unitary_decomp_method=mixed_fallback,
    ftqc.inter_handover_timescale_sec, decoder_char_timescale_sec, ftqc.processor.num_qubits, distill_widget_table
    (Table I footprints W×L, Q, C, p_out).'
checks:
- kind: literature
tags:
- config
- saadatmand2024
