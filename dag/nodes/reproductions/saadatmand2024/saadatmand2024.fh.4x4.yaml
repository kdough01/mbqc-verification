      path: quantities.n_logical.paper
    op: approx
    rel_tol: 0.01
    domain: Fermi–Hubbard 4×4, RRE 0.26.33 @ 9383b4d, config_calibrated.yaml, RRE's example widgetizer, FIFO ancilla reuse
