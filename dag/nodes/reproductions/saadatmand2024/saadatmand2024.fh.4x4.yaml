acknowledged:
- code: refuted
  reason: 'Configuration reproduces the QFT rows, so the remaining gap is in the Fermi–Hubbard circuit: runtime
    4–5× below the paper''s, governed by the unstated widget granularity (saadatmand2024.fh_runtime_widgets). Expected
    until the authors'' widgetization is known.'
