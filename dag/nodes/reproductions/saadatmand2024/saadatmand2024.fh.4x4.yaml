id: saadatmand2024.fh.4x4
kind: theorem
title: 'Fermi–Hubbard 4×4: Table II resources'
statement: 'Fermi–Hubbard 4×4 on the paper''s modular superconducting architecture needs: ñ_logical 74; logical
  bus patches 332; T patches 3.32k; allocated physical qubits 1.21M; modules 2; hardware time 35.1s; P_diss,4K 840W;
  P_diss,20mK 168nW; energy 5.73kWh (Table II of arXiv:2406.06015v3).'
description: Reproduced with the calibrated configuration (RRE's example widgetizer, FIFO ancilla reuse); results/calibrated/table2_fh_4x4.json.
  Each column is its own check; the column readings are saadatmand2024.column_readings.
code:
- experiments/rre/fh.py
- experiments/rre/compare.py
- experiments/rre/reproduce_table2.py
- experiments/rre/paper_v3_table2.yaml
- experiments/rre/config_calibrated.yaml
- experiments/rre/results/calibrated/fh_4x4.json
- experiments/rre/results/calibrated/table2_fh_4x4.json
depends_on:
- node: def.fermi_hubbard_square
  kind: uses
- node: saadatmand2024.config
  kind: assumes
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II, Fermi–Hubbard row 4x4
