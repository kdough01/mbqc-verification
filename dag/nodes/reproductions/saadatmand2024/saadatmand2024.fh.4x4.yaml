id: saadatmand2024.fh.4x4
kind: theorem
title: 'Fermi–Hubbard 4×4: Table II resources'
statement: 'QSP Hamiltonian simulation of the 4×4 Fermi–Hubbard model (t = 1, ε_qsp = 0.025) on the paper''s modular
  superconducting architecture needs: ñ_logical 74; logical bus patches 332; T patches 3.32k; allocated physical
  qubits 1.21M; modules 2; hardware time 35.1 s; P_diss,4K 840 W; P_diss,20mK 168 nW; energy 5.73 kWh (Table II
  of arXiv:2406.06015v3).'
description: Reproduced with the paper's own public pipeline (experiments/rre, results/table2_4x4.json). Each quantity
  is its own check; how RRE's outputs map onto the table's columns is our reading (experiments/rre/compare.py).
code:
- experiments/rre/fh.py
- experiments/rre/compare.py
- experiments/rre/paper_v3_table2.yaml
- experiments/rre/config_paper_v3.yaml
- experiments/rre/results/table2_4x4.json
depends_on:
- node: def.fermi_hubbard_square
  kind: uses
- node: saadatmand2024.config
  kind: assumes
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II, Fermi Hubbard row 4x4
checks:
- kind: reproduction
  name: reproduction-n-logical
  params:
    results: experiments/rre/results/table2_4x4.json
    path: quantities.n_logical.ours
    expect:
      path: quantities.n_logical.paper
    op: approx
    rel_tol: 0.01
    domain: FH 4x4, RRE 0.26.33 @ 9383b4d, pyLIQTR 1.3.3, config_paper_v3.yaml, default widgetization
- kind: reproduction
  name: reproduction-bus-patches
