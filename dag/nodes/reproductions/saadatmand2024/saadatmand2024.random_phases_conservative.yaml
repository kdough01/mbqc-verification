id: saadatmand2024.random_phases_conservative
kind: lemma
title: Random QSP phases give a conservative estimate
statement: 'Building the QSP circuit with random phase angles (and the correct number of them) gives resource counts
  at least as large as with the accurate phases: “This provides a conservative overestimate of the resource estimations”
  (§III.3).'
description: experiments/rre/phases.py compares pyLIQTR 1.3.3's random and Graphix-optimized phases for FH 2×2 and 4×4.
  pyLIQTR's random mode uses the cosine phase count for the sine sequence too (23/23 instead of 23/24 at 2×2), so
  the random circuit is slightly smaller.
code:
- experiments/rre/phases.py
- experiments/rre/results/phases.json
depends_on:
- node: def.fermi_hubbard_square
  kind: uses
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: §III.3, paragraph 1
checks:
- test: reproduction/recorded_value
  name: t-count-2x2
  params:
    results: experiments/rre/results/phases.json
    path: instances.2x2.random.T
    expect:
      path: instances.2x2.optimization.T
    op: ge
    domain: FH 2x2, pyLIQTR 1.3.3 estimate_resources
- test: reproduction/recorded_value
  name: t-count-4x4
  params:
    results: experiments/rre/results/phases.json
    path: instances.4x4.random.T
    expect:
      path: instances.4x4.optimization.T
    op: ge
    domain: FH 4x4, pyLIQTR 1.3.3 estimate_resources
acknowledged:
- code: refuted
  reason: 'Recorded counterexample: random phases give fewer T gates than Graphix-optimized phases at 2x2 and 4x4 (one phase
    fewer). Small (0.5-2%), but the claimed direction does not hold.'
tags:
- qsp
- saadatmand2024
