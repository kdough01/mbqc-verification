acknowledged:
- code: refuted
  reason: Physical qubits and the per-module power columns reproduce; the compiled register (40 vs 67) and runtime
    (9.3× the paper's) do not. The same configuration reproduces the QFT rows, so the difference is in the Ising
    circuit (lattice or encoding details); unresolved.
