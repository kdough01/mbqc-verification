id: saadatmand2024.ising.2x2
kind: theorem
title: 'Transverse-field Ising 2×2: Table II resources'
statement: 'Transverse-field Ising 2×2 on the paper''s modular superconducting architecture needs: ñ_logical 67;
  logical bus patches 652; T patches 2.43k; allocated physical qubits 1.41M; modules 2; hardware time 64.4s; P_diss,4K
  840W; P_diss,20mK 168nW; energy 10.5kWh (Table II of arXiv:2406.06015v3).'
description: Reproduced with the calibrated configuration (RRE's example widgetizer, greedy ancilla reuse); results/calibrated/table2_ising_2x2.json.
  Each column is its own check; the column readings are saadatmand2024.column_readings.
code:
- experiments/rre/fh.py
- experiments/rre/compare.py
- experiments/rre/reproduce_table2.py
- experiments/rre/paper_v3_table2.yaml
- experiments/rre/config_calibrated.yaml
- experiments/rre/results/calibrated/ising_2x2.json
- experiments/rre/results/calibrated/table2_ising_2x2.json
depends_on:
- node: def.transverse_ising_triangular
  kind: uses
- node: saadatmand2024.config
  kind: assumes
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II, Transverse-field Ising row 2x2
