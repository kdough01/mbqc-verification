id: saadatmand2024.qft.n100
kind: theorem
title: 'QFT N-100: Table II resources'
statement: 'QFT N-100 on the paper''s modular superconducting architecture needs: ñ_logical 100; logical bus patches
  3.39k; T patches 2.76k; allocated physical qubits 3.18M; modules 4; hardware time 10.4s; P_diss,4K 1.68kW; P_diss,20mK
  336nW; energy 3.39kWh (Table II of arXiv:2406.06015v3).'
description: Reproduced with the calibrated configuration (one widget per circuit); results/calibrated/table2_qft_N-100.json.
  Each column is its own check; the column readings are saadatmand2024.column_readings.
code:
- experiments/rre/fh.py
- experiments/rre/compare.py
- experiments/rre/reproduce_table2.py
- experiments/rre/paper_v3_table2.yaml
- experiments/rre/config_calibrated.yaml
- experiments/rre/results/calibrated/qft_N-100.json
- experiments/rre/results/calibrated/table2_qft_N-100.json
depends_on:
- node: def.qft_cirq
  kind: uses
- node: saadatmand2024.config
  kind: assumes
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II, QFT row N-100
checks:
- test: reproduction/recorded_value
  name: reproduction-n-logical
  params:
    results: experiments/rre/results/calibrated/table2_qft_N-100.json
    path: quantities.n_logical.ours
    expect:
      path: quantities.n_logical.paper
    op: approx
    rel_tol: 0.01
    domain: QFT N-100, RRE 0.26.33 @ 9383b4d, config_calibrated.yaml, one widget per circuit
- test: reproduction/recorded_value
