id: saadatmand2024.qft.n1000
kind: theorem
title: 'QFT N-1000: Table II resources'
statement: 'QFT N-1000 on the paper''s modular superconducting architecture needs: ñ_logical 1k; logical bus patches
  37.2k; T patches 9.57k; allocated physical qubits 43.4M; modules 52; hardware time 10.6m; P_diss,4K 21.8kW; P_diss,20mK
  4.37µW; energy 2.69MWh (Table II of arXiv:2406.06015v3).'
description: For the larger machine (experiments/rre/README.md, 'Larger instances'); its checks skip until the results
  file is committed.
code:
- experiments/rre/fh.py
- experiments/rre/compare.py
- experiments/rre/reproduce_table2.py
- experiments/rre/paper_v3_table2.yaml
- experiments/rre/config_calibrated.yaml
depends_on:
- node: def.qft_cirq
  kind: uses
- node: saadatmand2024.config
  kind: assumes
source:
  citation: 'S. N. Saadatmand et al., Superconducting qubits in the millions: the potential and limitations of modularity,
    arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  exact_form: Table II, QFT row N-1000
checks:
- kind: reproduction
  name: reproduction-n-logical
  params:
    results: experiments/rre/results/calibrated/table2_qft_N-1000.json
    path: quantities.n_logical.ours
    expect:
      path: quantities.n_logical.paper
    op: approx
    rel_tol: 0.01
    domain: QFT N-1000, RRE 0.26.33 @ 9383b4d, config_calibrated.yaml, one widget per circuit
- kind: reproduction
