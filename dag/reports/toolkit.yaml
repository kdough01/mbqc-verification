# Shared by every verification report (dagtool report) and published as reports/toolkit.html.
# strategies: what carries over from one paper to the next. tools: what a check can call on, and when.
# status: verifier = backs an implemented check kind (verification/kinds.py); used = run in a reproduction here;
# candidate = fits a claim type we expect, not wired in yet. Text fields accept `code`, **bold** and [links](url).
strategies:
  - title: Run the authors' own pipeline, pinned
    what: Before judging a number, rebuild exactly what produced it — the code at the commit the paper cites, its dependencies, the inputs — and record versions, commit and configuration hash with every result.
    why: Most disagreements turn out to be configuration or interpretation, not the method. A pinned run makes them visible instead of arguable.
    example: RRE 0.26.33 at `9383b4d`, Cabaliser at its submodule commit, pyLIQTR 1.3.3 and qualtran 0.4.0, built from scratch by `environment.sh`; every results file carries its provenance.
    how: "`reproduction` check reading committed results; the results files are listed under each node's `code:` so new runs make the evidence stale."
  - title: Calibrate on the least ambiguous instance first
    what: Find the instances whose input is unambiguous (no random phases, no ancillas, no unstated circuit choices) and settle the unstated settings there, with a grid of real runs. Only then score the harder instances, with those settings unchanged.
    why: If one configuration reproduces the unambiguous rows exactly, any remaining gap elsewhere is in that instance's circuit, not the configuration — the search space halves.
    example: "Three QFT rows × 48 combinations of unstated settings: exactly one point reproduces 26 of 27 columns (failure budget 0.05, RRE's factory table, t = 200 ns, one widget); it then reproduces QFT N-100 as a held-out instance."
    how: "`calibrate.py` writes every grid point; the calibration node's checks require a unique best point and that every alternative value of each setting scores lower."
  - title: Make every column's meaning a checked claim
    what: "A table column's mapping to the tool's outputs is a hypothesis: write it down, test the alternatives, and keep the old reading so earlier results stay reproducible."
    why: Notation can disagree between a paper's appendix and its tables.
    example: "Table II's ñ_logical is the input register (Parameter 15), not Appendix A's ñ (graph memory); its physical qubits are modules × Parameter 14, not the Parameter 35 the tool reports; its T patches count all modules."
    how: "`compare.MAPPING` (and `MAPPING_V1` for the first pass); a column-readings node checks each reading on instances that pin it down."
  - title: One check per reported number
    what: Record each quantity as its own check against its own printed value, with a tolerance tied to the printed precision and to run-to-run variation.
    why: A partial match is information. One pass/fail per row hides which column moved.
    example: "36 Table II checks for the QFT rows: 35 reproduce, 1 does not (N-25 bus patches)."
    how: "`reproduction` checks, `approx` within `rel_tol` (1% here: three printed significant figures, 0.1% scheduler noise)."
  - title: Re-derive the formulas independently
    what: Recompute closed-form outputs from the tool's intermediate values with the paper's own formulas, without importing the tool.
    why: It separates errors in the formulas from errors in the compiled input, and catches internal inconsistencies.
    example: "Appendix A's T-count and footprint formulas all match RRE, except Parameter 35 against modules × Parameter 14 — the inconsistency that later explained the physical-qubit column."
    how: "`rederive.py`; a `symbolic` check when the formula should hold in general."
  - title: Test correctness beyond the paper's own tests
    what: Run the paper's correctness test, then the same test on inputs it does not cover (every basis state, random states), and check that the test can fail.
    why: A test that passes on |0…0⟩ may be blind to the very errors it is meant to catch.
    example: "The Appendix C test passes with a wrong reference (rotation mapped to T, T† = T³); random inputs expose it, and show the compiled graphs themselves are right."
    how: "`cabaliser_inputs.py`; for MBQC patterns the `translation` and `numerical` checks do the same with graphix."
  - title: Check the qualitative claims too
    what: Turn statements in the text ("conservative", "dominates", "scales as") into checks with a direction.
    why: They are easy to state and rarely tested; they are also what readers repeat.
    example: "Random QSP phases were claimed conservative; with the pinned code they give 1,405 fewer T gates at 2×2."
    how: "`reproduction` with `op: ge`/`le`; `refuter` when a counterexample search is possible."
  - title: Measure what the paper leaves out
    what: For each unstated setting, run every plausible value and record its effect on each reported quantity.
    why: It tells you which missing detail matters, and what to ask the authors.
    example: "Widget granularity moves the Fermi–Hubbard 4×4 runtime from 0.24× to 25× the paper's; the failure-budget reading moves the code distance by 4."
    how: "`sensitivity.py`, `fh_widgets.py`: real runs, recorded with failures."
  - title: Scaling only from runs, never from fits
    what: A scaling statement is a series of actual runs; a point that was not run is absent, and the paper's values appear only where it prints them.
    why: Extrapolation hides exactly the regime changes (module count, widget levels) that make these estimates interesting.
    example: "QFT N = 4…100 and Fermi–Hubbard N = 2…6 are all runs; the QFT series crosses from two to four modules between N = 64 and 80."
    how: "`scaling.py`; the `scaling` check kind for formulas likewise requires held-out grid points."
  - title: Split small and large runs, and say which is which
    what: Small instances run in CI on every change; large ones run on a dedicated machine. Their nodes exist from the start and skip until results are committed.
    why: The record shows what has not been checked yet, and the large runs need no new wiring.
    example: "Fermi–Hubbard 8×8–20×20, QFT N-500/1000 and Ising 5×5 have nodes and a runbook; their checks skip."
    how: "`run.sh --only …` or the `reproduce` workflow with a self-hosted runner label."
  - title: Keep expected refutations visible, not failing
    what: When a refutation is the finding, acknowledge it with a reason so CI stays green while the node stays refuted.
    why: Findings must survive in the record without blocking every later change.
    example: "Fermi–Hubbard and Ising rows, QFT N-25's bus patches, the Appendix C test."
    how: "`acknowledged:` on the node; the report and the theorem browser show the reason."
  - title: Record the dead ends
    what: Write down what did not work — build failures, settings that crash, readings that were wrong — next to what did.
    why: The next paper hits the same walls; the first-pass reading here was wrong in three columns.
    example: "Rust lint in Cabaliser, IPython 8, the widgetizer's IndexError below the default level at 2×2, the first column readings."
    how: "The report's approach steps and the first-pass results kept beside the calibrated ones."

applicability:
  - claim: A theorem with an exact statement
    example: "e.g. a vertex count N = (36n − 18)D + 92n − 20"
    tools: [lean, sympy, verifier-scaling]
    method: "Formalize and prove in Lean; certify identities with SymPy; until proved, fit on a grid with held-out points and search for counterexamples."
  - claim: A gate-to-MBQC translation is correct
    example: "e.g. a compiled pattern implements its circuit"
    tools: [graphix, qiskit, cabaliser]
    method: "`translation`/`numerical`: compile, then simulate the pattern against the circuit unitary on basis and random inputs."
  - claim: A resource table produced by a pipeline
    example: "e.g. Table II of a resource-estimation paper"
    tools: [verifier-reproduction, rre, pyliqtr, cirq, cabaliser]
    method: "Pin the pipeline, calibrate unstated settings on the least ambiguous rows, one `reproduction` check per number."
  - claim: A gate count (T-count, rotations, qubits)
    example: "e.g. N_T = n_Rz·L_ε + n_T"
    tools: [qualtran, gridsynth, sympy, verifier-reproduction]
    method: "Count independently (Qualtran's cost model, synthesis lengths from gridsynth) and compare; re-derive the closed form."
  - claim: A logical-error model or threshold fit
    example: "e.g. p_C = κ (p/p_th)^((d+1)/2) with κ = 0.009, p_th = 0.016"
    tools: [stim, pymatching, sinter]
    method: "Sample surface-code memory experiments at several d and p, decode with MWPM, refit κ and p_th, compare within the fit's uncertainty."
  - claim: A cross-estimator comparison
    example: "e.g. physical qubits or runtime against another architecture's estimate"
    tools: [azure-re, rre, qualtran]
    method: "Run a second estimator under matched assumptions; agreement in order of magnitude, with the differing assumptions listed."
  - claim: A qualitative or scaling statement
    example: "e.g. random phases are conservative; runtime grows with problem size"
    tools: [verifier-reproduction, verifier-scaling]
    method: "A direction (`ge`/`le`) checked on actual runs over the sizes run; never from a fit."

tools:
  - id: verifier-reproduction
    name: reproduction check
    category: Verifier check kind
    status: verifier
    checks: A recorded run of a pinned pipeline agrees with a claimed value (approx within a tolerance, eq, ge, le).
    applies: Any number a paper reports that a pipeline you can run produces.
    limits: Grants at most `empirical`, on the domain of the runs.
    check_kinds: [reproduction]
  - id: lean
    name: Lean 4
    url: https://lean-lang.org
    category: Proof assistant
    status: verifier
    checks: Proofs of exact statements; the vetted definitions, mutation and non-vacuity checks keep the statement faithful.
    applies: Exact theorems about patterns, counts and constructions once they are formalized.
    limits: Proved only modulo declared assumptions; formalization is the bottleneck (the agent drafts, checks gate).
    check_kinds: [lean, vocabulary, nonvacuity, differential, equivalence]
  - id: sympy
    name: SymPy
    url: https://www.sympy.org
    category: Computer algebra
    status: verifier
    checks: Algebraic certificates for identities and closed forms (e.g. coefficient positivity).
    applies: A formula that should hold symbolically, before (or instead of) a Lean proof.
    check_kinds: [symbolic]
  - id: verifier-scaling
    name: scaling, mutation and refuter checks
    category: Verifier check kinds
    status: verifier
    checks: A formula reproduces every count on a grid including held-out points; perturbed formulas are rejected; counterexample search.
    applies: Counting formulas (vertices, edges, depth) that are checked on actual compiled instances.
    check_kinds: [scaling, mutation, refuter, finite]
  - id: graphix
    name: graphix
    url: https://github.com/TeamGraphix/graphix
    category: MBQC patterns
    status: verifier
    checks: Builds and simulates measurement patterns; standardization, signal shifting, Pauli removal.
    applies: Any claim that a measurement pattern implements a circuit, or about a pattern's size.
    check_kinds: [translation, numerical]
  - id: qiskit
    name: Qiskit
    url: https://www.ibm.com/quantum/qiskit
    category: Circuits and simulation
    status: verifier
    checks: Reference circuits and statevectors for translation checks.
    applies: Gate-model side of a gate-to-MBQC comparison.
    check_kinds: [translation, numerical]
  - id: rre
    name: Rigetti Resource Estimation (RRE)
    url: https://github.com/rigetti/rigetti-resource-estimation
    category: Fault-tolerant resource estimator
    status: used
    checks: Code distance, factories, qubits, runtime, power and energy for graph-state-compiled circuits on a modular superconducting architecture.
    applies: Papers whose numbers came from RRE, or that assume a comparable architecture.
    limits: Some settings (widgetization, ancilla allocation) change results a lot and are often unstated; the scheduler varies by about 0.1% between runs.
    check_kinds: [reproduction]
  - id: cabaliser
    name: Cabaliser and its local simulator
    url: https://github.com/Alan-Robertson/cabaliser
    category: Graph-state compiler
    status: used
    checks: Compiles Clifford+T+Rz to graph states, measurement schedules and Pauli frames; the simulator checks a compiled widget against its circuit on any input.
    applies: Graph-state (MBQC) compilation claims; correctness of compiled widgets.
    limits: The bundled simulator's Tdag is S·T; supply the correct T† and the real rotation angles.
    check_kinds: [reproduction, translation]
  - id: pyliqtr
    name: pyLIQTR
    url: https://github.com/isi-usc-edu/pyLIQTR
    category: Hamiltonians and QSP circuits
    status: used
    checks: Problem instances (Fermi–Hubbard, Heisenberg, …), block encodings, QSP phase counts, gate counts.
    applies: Hamiltonian-simulation papers built on it; independent instance construction.
    limits: Random-phase mode uses one phase fewer for the sine sequence (1.3.3).
    check_kinds: [reproduction]
  - id: cirq
    name: Cirq
    url: https://quantumai.google/cirq
    category: Circuits
    status: used
    checks: Circuit construction (QFT), unitaries for small checks, decomposition contexts that set ancilla allocation.
    applies: Circuits a paper builds with Cirq; how ancillas are allocated matters for register sizes.
    check_kinds: [reproduction, numerical]
  - id: qualtran
    name: Qualtran
    url: https://github.com/quantumlib/Qualtran
    category: Fault-tolerant algorithms and cost models
    status: candidate
    checks: Independent T-, Toffoli-, rotation- and qubit-counts for the same algorithm (it is already the decomposition layer under pyLIQTR here).
    applies: T-count and register claims; a second count before trusting one tool's.
    check_kinds: [reproduction, symbolic]
  - id: gridsynth
    name: gridsynth (Ross–Selinger) synthesis
    url: https://www.mathstat.dal.ca/~selinger/newsynth/
    category: Rotation synthesis
    status: candidate
    checks: Actual Clifford+T lengths for single-qubit rotations at a precision ε, against a stated L_ε formula.
    applies: Claims that depend on synthesis constants (c0, c1).
    check_kinds: [reproduction, scaling]
  - id: stim
    name: Stim
    url: https://github.com/quantumlib/Stim
    category: Stabilizer simulation
    status: candidate
    checks: Generates and samples surface-code circuits under circuit-level noise.
    applies: Logical-error models, thresholds and code-distance choices.
    check_kinds: [numerical, reproduction]
  - id: pymatching
    name: PyMatching
    url: https://github.com/oscarhiggott/PyMatching
    category: Decoder (MWPM)
    status: candidate
    checks: Minimum-weight perfect-matching decoding of sampled syndromes, the decoder the paper's error fit assumes.
    applies: With Stim, re-deriving a logical-error fit.
    check_kinds: [numerical]
  - id: sinter
    name: sinter
    url: https://github.com/quantumlib/Stim/tree/main/glue/sample
    category: Monte Carlo sampling
    status: candidate
    checks: Runs Stim + decoder sampling at scale and collects logical error rates with confidence intervals.
    applies: Refitting κ and p_th within uncertainty.
    check_kinds: [numerical]
  - id: azure-re
    name: Azure Quantum Resource Estimator
    url: https://learn.microsoft.com/en-us/azure/quantum/intro-to-resource-estimation
    category: Fault-tolerant resource estimator
    status: candidate
    checks: A second, independently built estimate of qubits and runtime under its own architecture assumptions.
    applies: Order-of-magnitude cross-checks of resource tables, with assumptions matched where possible.
    limits: Different architecture model; agreement is approximate by construction.
    check_kinds: [reproduction]
