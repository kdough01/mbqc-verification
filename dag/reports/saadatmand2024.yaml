# Narrative for the verification report page of Saadatmand et al. (arXiv:2406.06015v3).
# `dagtool report` combines it with the live DAG: node statuses, every check's latest evidence, and the
# committed results under experiments/rre/results. Text fields accept `code`, **bold** and [links](url).
id: saadatmand2024
title: 'Superconducting qubits in the millions: Table II resource estimates'
short_title: Saadatmand et al. reproduction
paper:
  citation: 'S. N. Saadatmand, T. L. Wilson, M. J. Hodson, M. Field, S. J. Devitt et al., Superconducting qubits in the millions:
    the potential and limitations of modularity, arXiv:2406.06015v3'
  url: https://arxiv.org/abs/2406.06015v3
  html: https://arxiv.org/html/2406.06015v3
kind_of_claim: numerical estimates (reproduction of a resource-estimation table), not theorems
summary: Reference B of the Thrust 2 note *QSP Hamiltonian Simulation — Gate-Based to MBQC* compiles circuits to graph states
  with Cabaliser and estimates fault-tolerant resources with Rigetti's resource estimator (RRE). We re-ran Table II with the
  authors' own public pipeline, pinned to the commit their code release cites. A first pass with the configuration as printed
  reproduced only the module count and power. A second pass calibrated the settings the paper does not state on the QFT rows,
  whose circuits are unambiguous, and then scored Fermi–Hubbard and Ising with those settings unchanged. Every reported number
  is its own check in the DAG.
headline: 'With four unstated settings fixed by calibration and the table''s columns read correctly, the QFT rows reproduce:
  35 of 36 numbers within 1% for N = 4, 10, 25, 100. The same configuration leaves Fermi–Hubbard runtimes 4–5× below the paper''s;
  runtime there is set by how finely the circuit is cut into widgets, which the paper does not state and the public widgetizer
  cannot reproduce at 2×2. Ising 2×2 reproduces its physical qubits but not its register or runtime. The compiled graphs are
  correct on every input we tried; the paper''s own correctness test cannot show it.'
scope:
- label: Checked
  text: 'Table II, all three families: ñ_logical, logical bus patches, T patches, allocated physical qubits, modules, runtime,
    P_diss,4K, P_diss,20mK, energy.'
- label: Run
  text: 'QFT N-4, N-10, N-25, N-100; Fermi–Hubbard 2×2 and 4×4; Ising 2×2. Scaling series: QFT N = 4…100 and Fermi–Hubbard
    N = 2…6, all actual runs.'
- label: Not run
  text: 'Fermi–Hubbard 8×8–20×20, QFT N-500 and N-1000, Ising 5×5: nodes exist and their checks skip until results come from
    the larger machine.'
- label: Not checked
  text: Fermi–Hubbard 50×50 and 100×100, Ising 10×10 and 19×19, Table III, the connectivity study of Fig. 11.
links:
- label: Reproduction code and runbook
  url: https://github.com/kdough01/mbqc-verification/tree/main/experiments/rre
- label: Committed results
  url: https://github.com/kdough01/mbqc-verification/tree/main/experiments/rre/results
- label: DAG nodes
  url: https://github.com/kdough01/mbqc-verification/tree/main/dag/nodes/reproductions/saadatmand2024
- label: Rigetti Resource Estimation
  url: https://github.com/rigetti/rigetti-resource-estimation
- label: Verification toolkit
  url: toolkit.html
pipeline:
- name: Input circuit
  detail: pyLIQTR 1.3.3 QSVT circuits (Fermi–Hubbard, Ising) with random phases; cirq.qft
  checked_by:
  - build
  - phases
  - calibrate
- name: Widgets
  detail: RRE's CirqWidgetizer cuts the circuit into subcircuits
  checked_by:
  - explain
  - widgets
- name: Clifford + T + Rz
  detail: transpiled; each Rz synthesized with L_ε T gates; ancillas allocated by a qubit manager
  checked_by:
  - rederive
  - rerun
- name: Graph states
  detail: 'Cabaliser: graph, measurement bases, Pauli frames'
  checked_by:
  - inputs
- name: Schedule
  detail: 'Substrate Scheduler: preparation, consumption, handover'
  checked_by:
  - run
  - widgets
- name: FT estimate
  detail: code distance, factories, modules, qubits, time, power, energy
  checked_by:
  - compare
  - rederive
  - calibrate
  - scaling
steps:
- id: read
  title: Read the claim and the method
  what: 'Started from the Thrust 2 known-results note, then the v3 PDF. Identified what is checkable: the Fermi–Hubbard rows
    of Table II, the estimator formulas of Appendix A (Parameters 1–48), the Appendix C unitarity test, and §VIII, which says
    the released code and sample configurations are “required to reproduce similar results” and that full data are available
    on request.'
  outputs:
  - 'paper_v3_table2.yaml: the table as printed, plus SI values'
  code:
  - experiments/rre/paper_v3_table2.yaml
- id: build
  title: Pin and build the authors' pipeline
  what: RRE 0.26.33 at commit `9383b4d`, Cabaliser at its submodule commit, pyLIQTR 1.3.3, gosc graph-state generation. `environment.sh`
    builds everything from scratch into `.rre/` and runs RRE's own verification tests as a smoke test (3 passed).
  obstacles:
  - 'pyLIQTR 1.3.3 has no build for Python 3.13: the environment uses Python 3.11 (uv).'
  - 'pyLIQTR imports `set_matplotlib_formats`, removed in IPython 8: pinned `ipython<8`.'
  - 'No Rust on the machine and rustup blocked: Rust installed from conda-forge with micromamba.'
  - 'Cabaliser''s pauli_tracker crate fails on Rust ≥ 1.90 (lint `dangerous_implicit_autorefs`): built with `RUSTFLAGS=--cap-lints=warn`;
    a stale target directory then needed a clean `make all`.'
  - 'RRE''s example script calls `get_all_non_trivial_op_labeller_list`, which no longer exists: used `GraphStateEquivalenceMapper()`
    defaults.'
  code:
  - tools/rre/environment.sh
  - tools/rre/requirements-rre.txt
- id: config
  title: Transcribe the configuration (first pass)
  what: Wrote the paper's settings as an overlay on RRE's default `params.yaml`. Where the paper and RRE's defaults differ,
    the paper wins; where the paper is silent, RRE's default is used and the setting is marked as not stated (table below).
    The pyLIQTR sign convention was mapped explicitly (its J = −1 is the paper's J = 1).
  code:
  - experiments/rre/config_paper_v3.yaml
  nodes:
  - saadatmand2024.config
  - def.fermi_hubbard_square
- id: run
  title: Run Fermi–Hubbard (first pass)
  what: '`fh.py` builds FermiHubbard(shape=(N, N), J=−1, U=2), evolution time t = 1 (τ = t·α), ε_qsp = 0.025, random phases,
    FermiHubbardSquare encoding, then runs RRE''s `estimation_pipeline` with the Cabaliser method and writes every RRE output
    with provenance (versions, commit, config hash, timings). 2×2 and 4×4 take about a second of pipeline time each.'
  obstacles:
  - FermiHubbardSquare only encodes square lattices (2×1 fails), so 2×2 is the smallest instance.
  - The Substrate Scheduler is slightly nondeterministic (preparation schedule 10,610 vs 10,608 between identical runs; ~0.1%
    in runtime), so all comparisons use a 1% tolerance.
  code:
  - experiments/rre/fh.py
  - experiments/rre/run.sh
  results:
  - experiments/rre/results/fh_2x2.json
  - experiments/rre/results/fh_4x4.json
- id: compare
  title: Compare with Table II (first pass)
  what: '`compare.py` maps RRE''s outputs onto the table''s columns. The first pass read ñ_logical as RRE''s graph memory
    (Appendix A''s Parameter 2), physical qubits as Parameter 35 (what RRE reports) and T patches per module. With `config_paper_v3.yaml`
    (failure budget 0.95, Table I as printed) only modules and both power columns matched; the register came out about twice
    the paper''s and the runtime about a fifth.'
  code:
  - experiments/rre/compare.py
  results:
  - experiments/rre/results/table2_2x2.json
  - experiments/rre/results/table2_4x4.json
  nodes:
  - saadatmand2024.fh.2x2
  - saadatmand2024.fh.4x4
- id: explain
  title: Look for the settings that explain the gap (first pass)
  what: 'Varied the settings the paper does not state, one at a time: widget size (max qubits and gates per widget), ancilla
    allocation during decomposition (fresh qubits or greedy reuse), the reading of the failure budget in Eq. (27), and the
    characteristic gate time. Greedy ancilla reuse moves ñ from 87 to 76 at 2×2 (159 to 135 at 4×4); smaller widgets give
    125 at 4×4 and fail at 2×2; the failure budget moves the code distance (10 → 14) and the gate time moves the runtime,
    but neither moves the register.'
  obstacles:
  - Widgets of ≤ 2000 gates make qualtran's addition decomposition fail at 2×2 (IndexError); recorded as an error for that
    variant.
  code:
  - experiments/rre/sensitivity.py
  results:
  - experiments/rre/results/sensitivity.json
- id: rederive
  title: Re-derive the estimator formulas
  what: '`rederive.py` recomputes Appendix A Parameters 4, 5, 7, 9, 11, 14, 17, 27–31 and 35 from RRE''s intermediate outputs
    and the configuration, so a mismatch can be placed in the formulas or in the compiled circuit. All agree with RRE except
    one consistency relation: the total allocated physical qubits (Parameter 35) is not modules × the per-module allocation
    (Parameter 14).'
  code:
  - experiments/rre/rederive.py
  results:
  - experiments/rre/results/rederive_2x2.json
  - experiments/rre/results/rederive_4x4.json
  nodes:
  - saadatmand2024.t_count_formula
  - saadatmand2024.physical_qubit_accounting
- id: inputs
  title: Test the compiled graphs beyond the paper's test
  what: 'The paper''s Appendix C test (RRE''s `test_unitary_verif_cabaliser.py`) simulates compiled graph states from |000⟩
    only. `cabaliser_inputs.py` compiles the same circuits and compares the post-selected output with the circuit unitary
    on all 8 basis inputs and random Haar inputs, twice: with the circuit''s real rotation angle and a correct T†, and with
    the published test''s gate table.'
  code:
  - experiments/rre/cabaliser_inputs.py
  results:
  - experiments/rre/results/cabaliser_inputs.json
  - experiments/rre/results/cabaliser_inputs_rre_test_table.json
  nodes:
  - saadatmand2024.compiled_graphs_correct
  - saadatmand2024.appendix_c_test_general
  obstacles:
  - 'Each random input takes seconds to simulate on a laptop-class VM: 3 random inputs locally, 20 by default in CI.'
- id: phases
  title: Check a claim from the text
  what: §III.3 says random QSP phases give a conservative overestimate. `phases.py` builds 2×2 and 4×4 with random and with
    optimized phases and compares pyLIQTR's gate counts.
  code:
  - experiments/rre/phases.py
  results:
  - experiments/rre/results/phases.json
  nodes:
  - saadatmand2024.random_phases_conservative
- id: calibrate
  title: Calibrate on the QFT rows
  what: 'The QFT rows use `cirq.qft`: no random phases, no ancillas, no QSP. Only the configuration can differ there, so they
    settle it. `calibrate.py` ran the pipeline at every combination of five unstated or ambiguous settings — failure budget
    (0.95, 0.5, 0.05), logical-error fit (paper, RRE), T-factory table (Table I as printed, RRE''s shipped table), gate time
    (200, 50 ns), widgets (one per circuit, RRE''s example) — on QFT N-4, N-10 and N-25: 48 points, 144 runs. Exactly one
    point reproduces 26 of the 27 columns; the runner-up reproduces 22. The same runs settled the column readings: ñ_logical
    is the input register, physical qubits are modules × Parameter 14, T patches count all modules.'
  code:
  - experiments/rre/calibrate.py
  - experiments/rre/compare.py
  - experiments/rre/config_calibrated.yaml
  results:
  - experiments/rre/results/calibrated/calibration.json
  nodes:
  - saadatmand2024.calibration
  - saadatmand2024.column_readings
  - saadatmand2024.config
  obstacles:
  - PyYAML reads `1.32e6` as a string (YAML 1.1 needs a sign in the exponent); comparisons convert explicitly.
  - 'The failure budget is printed as 0.95 in Eq. (27) but RRE''s `target_p_algo` is a failure probability: only 0.05 reproduces.'
- id: rerun
  title: Re-run every small instance with the calibrated settings
  what: '`reproduce_table2.py` runs QFT N-4, N-10, N-25 and N-100 (N-100 was not in the calibration: a held-out check, and
    the only small instance with four modules), Fermi–Hubbard 2×2 and 4×4, and Ising 2×2, all with `config_calibrated.yaml`.
    Fermi–Hubbard ancillas are reused in allocation order (cirq''s GreedyQubitManager, maximize_reuse=False), the one allocation
    that gives the paper''s 74-qubit register at 4×4.'
  code:
  - experiments/rre/reproduce_table2.py
  - experiments/rre/fh.py
  results:
  - experiments/rre/results/calibrated/table2_qft_N-4.json
  - experiments/rre/results/calibrated/table2_qft_N-100.json
  - experiments/rre/results/calibrated/table2_fh_2x2.json
  - experiments/rre/results/calibrated/table2_fh_4x4.json
  - experiments/rre/results/calibrated/table2_ising_2x2.json
  nodes:
  - saadatmand2024.qft.n4
  - saadatmand2024.qft.n10
  - saadatmand2024.qft.n25
  - saadatmand2024.qft.n100
  - saadatmand2024.fh.2x2
  - saadatmand2024.fh.4x4
  - saadatmand2024.ising.2x2
  obstacles:
  - Compiling QFT N-25 or Fermi–Hubbard as one widget is fine; Ising 2×2 as one widget crashes Cabaliser (assertion in tableau_create),
    so Ising keeps RRE's example widgetizer.
- id: widgets
  title: Explain the Fermi–Hubbard runtime
  what: 'With the configuration that reproduces every QFT runtime, Fermi–Hubbard still runs 4–5× faster than Table II. Its
    runtime is dominated by inter-module handover, paid once per widget step (Eq. 21), so it depends on how finely the circuit
    is cut. `fh_widgets.py` runs every granularity the public widgetizer produces: at 4×4 the paper''s 35.1 s lies between
    the 2,948-step level (0.88×) and the 11,572-step level (3.6×), and the finest level gives the paper''s 83-patch graph
    memory exactly but 25× the runtime.'
  code:
  - experiments/rre/fh_widgets.py
  results:
  - experiments/rre/results/calibrated/fh_widgets.json
  nodes:
  - saadatmand2024.fh_runtime_widgets
  obstacles:
  - At 2×2 every widget size below RRE's default fails in qualtran's adder decomposition (IndexError), so the finer cuts the
    paper's 2×2 runtime would need cannot be produced with the public code.
- id: scaling
  title: Measure scaling from actual runs
  what: '`scaling.py` runs QFT at N = 4, 6, 8, 10, 12, 16, 20, 25, 32, 40, 50, 64, 80, 100 and Fermi–Hubbard at N = 2…6 with
    the calibrated settings. Every point is a run; nothing is fitted or extrapolated, and the paper''s values are shown only
    where Table II prints them. Each run takes a few seconds on a laptop-class VM.'
  code:
  - experiments/rre/scaling.py
  results:
  - experiments/rre/results/calibrated/scaling.json
- id: record
  title: Record everything in the DAG
  what: 'Added the `reproduction` check kind (ceiling: empirical). It reads one committed value and compares it with the claim;
    agreement grants empirical on the stated domain, disagreement refutes the node there, and a missing results file is a
    skip. Expected refutations carry an `acknowledged` reason so CI stays green while the finding stays visible. Results files
    are listed under each node''s `code:`, so new results make the evidence stale and CI re-runs exactly those checks. The
    first pass''s results are kept beside the calibrated ones, so both are reproducible.'
  code:
  - checks/reproduction/recorded_value.py
  - .github/workflows/reproduce.yml
- id: large
  title: Prepare the larger lattices (not run)
  what: Fermi–Hubbard 8×8–20×20, QFT N-500 and N-1000 and Ising 5×5 have nodes whose checks skip until results exist. On the
    larger machine, `run.sh --only fh:8 fh:16 fh:20 qft:500 qft:1000 ising:5` runs them with the calibrated settings and writes
    `results/calibrated/`; commit and push, and CI does the rest.
  nodes:
  - saadatmand2024.fh.8x8
  - saadatmand2024.fh.16x16
  - saadatmand2024.fh.20x20
  - saadatmand2024.qft.n500
  - saadatmand2024.qft.n1000
  - saadatmand2024.ising.5x5
config:
- - Physical error rate p
  - 10⁻³
  - stated
  - §II.4.7
- - Logical-error fit κ, p_th
  - 0.009, 0.016
  - stated
  - Appendix D (RRE's default 0.3, 0.0143 scores 15/27 at best)
- - Rotation synthesis
  - mixed fallback, L_ε = ⌈0.57 log₂(1/ε) + 8.83⌉
  - stated
  - Appendix A, Parameters 16–17
- - Module capacity
  - 10⁶ physical qubits
  - stated
  - §II.4.7
- - Inter-module handover, decoder timescale
  - 1 µs
  - stated
  - §II.3, Parameter 27
- - ε_qsp, t, J, U
  - 0.025, 1, 1, 2
  - stated
  - §III.2.3, Eqs. (24)–(25)
- - Failure budget
  - 'target_p_algo = 0.05 (first pass: 0.95)'
  - calibrated
  - §III.2.3 says p_algo = 0.95 success; Eq. (27) prints it as p_algo-fail. Only 0.05 reproduces the QFT rows.
- - T-factory table
  - 'RRE''s shipped table (first pass: Table I as printed)'
  - calibrated
  - Table I's footprints and one p_out differ from RRE's; Table I scores 22/27 at best
- - Characteristic gate time t
  - 200 ns
  - calibrated
  - Not stated; every QFT runtime reproduces with it, 50 ns scores 20/27
- - Widgets (QFT)
  - one widget per circuit
  - calibrated
  - Not stated; RRE's example widgetizer scores 17/27
- - Widgets (Fermi–Hubbard, Ising)
  - RRE's example widgetizer (≤ 10,000 gates, ≤ 100 qubits)
  - not stated
  - Sets the Fermi–Hubbard runtime (saadatmand2024.fh_runtime_widgets)
- - Ancilla allocation
  - 'Fermi–Hubbard: reuse in allocation order; Ising: greedy reuse'
  - not stated
  - FIFO reuse gives the paper's 74-qubit register at 4×4
- - QSP phases
  - random, correct count
  - stated
  - §III.3
