- - Rigetti Resource Estimation
  - 0.26.33 @ 9383b4d
- - Cabaliser
  - submodule @ 10f5c4e
- - pyLIQTR
  - 1.3.3
- - gosc graph-state-generation
  - '@ 3a4f151'
- - Python
  - '3.11'
- - Verifier check environment
  - Python 3.13, see requirements.txt
- - qualtran
  - 0.4.0 (pinned by pyLIQTR)
- - cirq-core
  - 1.4.0
