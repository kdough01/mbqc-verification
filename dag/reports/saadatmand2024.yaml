findings:
- title: The QFT rows reproduce once four settings are calibrated
  status: reproduced
  question: Which configuration produced Table II?
  read: §III.2.3 (p_algo); Table I; Table II, QFT rows
  example: Failure budget 0.05, RRE's shipped factory table, t = 200 ns and one widget per circuit reproduce 35 of 36 QFT
    numbers within 1%, including N-100, which was held out of the calibration and is the only small instance on four modules.
  check: The grid of 48 settings has a unique best point (26/27 against 22/27 for the runner-up); changing any one setting
    lowers the score. Neither the printed Table I nor the Eq. (27) reading of the budget reproduces the table.
  nodes:
  - saadatmand2024.calibration
  - saadatmand2024.qft.n4
  - saadatmand2024.qft.n10
  - saadatmand2024.qft.n100
- title: What Table II's columns count
  status: reproduced
  question: How do the table's columns map onto the estimator's outputs?
  read: Table II header; Appendix A, Parameters 2, 14, 15, 35
  example: ñ_logical is the input register (4, 10, 25, 100 for QFT; 74 for Fermi–Hubbard 4×4), not Appendix A's ñ (graph memory).
    Physical qubits are modules × Parameter 14 (factories at Q qubits), not Parameter 35, which RRE reports. T patches count
    all modules.
  check: Each reading checked on the instances that pin it down; the first pass's three readings were each wrong.
  nodes:
  - saadatmand2024.column_readings
  - saadatmand2024.physical_qubit_accounting
- title: Fermi–Hubbard runtime is set by unstated widget granularity
  status: not reproduced
  question: Why does Fermi–Hubbard run 4–5× faster than Table II when every QFT runtime matches?
  read: Eq. (21); Appendix B; Table II, Fermi–Hubbard rows
  example: Runtime is mostly handover, paid per widget step. At 4×4 the public widgetizer's levels give 0.24×, 0.88×, 3.6×
    and 25× the paper's runtime; the finest gives the paper's 83-patch graph memory exactly. At 2×2 levels finer than the
    default fail (IndexError in qualtran's adder decomposition).
  check: The configuration is not the cause (it reproduces QFT). The paper's widgetization, and whether its widgetizer could
    cut 2×2 more finely, would settle it.
  nodes:
  - saadatmand2024.fh_runtime_widgets
  - saadatmand2024.fh.2x2
  - saadatmand2024.fh.4x4
- title: QFT N-25's bus patches break the trend of their neighbours
  status: not reproduced
  question: Why does one QFT number out of 36 not reproduce?
  read: Table II, QFT N-25
  example: Bus patches 572 against the printed 2.02k, while the other eight N-25 columns reproduce. Ours grow 88, 248, 572,
    3,392 for N = 4, 10, 25, 100; the paper's print 88, 248, 2,020, 3,390.
  check: Unresolved; consistent with a misprint, but that is not established.
  nodes:
  - saadatmand2024.qft.n25
- title: Ising 2×2 reproduces its qubits, not its register or runtime
  status: not reproduced
  question: Does the calibrated configuration carry over to the transverse-field Ising row?
  read: Eq. (24); §III.3; Table II, Ising 2×2
  example: Physical qubits within 0.4%, T patches within 2%, modules and power exact. The register is 40 qubits against 67
    and the runtime 9.3× the paper's (T count about 1.5 million).
  check: As for Fermi–Hubbard, the difference is in the circuit (lattice or encoding details, widgetization); unresolved.
  nodes:
  - saadatmand2024.ising.2x2
- title: Random phases are not conservative with the pinned code
  status: refuted
  question: Do random QSP phases overestimate the resources?
  read: §III.3
  exact: This provides a conservative overestimate of the resource estimations
  example: 62,170 T gates with random phases against 63,575 with optimized phases at 2×2; 353,410 against 355,211 at 4×4.
  check: pyLIQTR 1.3.3's random mode uses the cosine sequence's phase count for the sine sequence too (23/23 instead of 23/24),
    so the random circuit is slightly smaller. Small (0.5–2%), but the stated direction does not hold.
  nodes:
  - saadatmand2024.random_phases_conservative
- title: The published correctness test cannot detect wrong rotations
  status: refuted
  question: Would the Appendix C test catch a compiled graph that implements the wrong unitary?
  read: Appendix C, paragraph after Eq. (30); RRE tests/verify_n_validate/test_unitary_verif_cabaliser.py
  example: The test's table maps the arbitrary-rotation tag (77) to T, and Cabaliser's simulator defines Tdag = S·T = T³.
    Both are diagonal, so from |000⟩ the test passes; on random inputs the same table gives fidelity 0.013–0.24.
  check: With the real angle and a correct T†, the compiled graphs are right on all 8 basis inputs and every random input
    (fidelity 1.0). The graphs pass; the test alone does not show it. Worth reporting to the RRE maintainers.
  nodes:
  - saadatmand2024.compiled_graphs_correct
  - saadatmand2024.appendix_c_test_general
- title: Appendix A's two physical-qubit totals disagree
  status: refuted
  question: Is the total allocation (Parameter 35) equal to modules × the per-module allocation (Parameter 14)?
  read: Appendix A, Parameters 14 and 35
  example: Parameter 35 counts each T-factory by its footprint in 2d² patches (1.66M at 2×2, what RRE reports); modules ×
    Parameter 14 counts it by its qubit count Q from Table I (1.29M), closer to the paper's 1.32M.
  check: 'Which total Table II uses: modules × Parameter 14 (finding 2). RRE''s reported Parameter 35 is the other one.'
  nodes:
  - saadatmand2024.physical_qubit_accounting
- title: The gate-synthesis T-count reproduces exactly
  status: reproduced
  question: Does N_T = n_Rz·L_ε + n_T hold for RRE's outputs?
  read: Appendix A, Parameters 16–17
  example: L_ε = 24 and N_T = 356·24 + 12,992 = 21,536 at 2×2.
  check: Every other re-derived parameter matches RRE as well.
  nodes:
  - saadatmand2024.t_count_formula
