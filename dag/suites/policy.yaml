# Test-suite policy: what a proposal's suite (proposals/<node>/suite.json) must and may contain.
#
# A formalization proposal names the claim type of its theorem and proposes checks beyond the fixed Lean ones.
# The verifier always adds `required` itself; the suite must also satisfy every `require_one_of` group, and may
# only use the `allowed` kinds, each within its `params` rules below. Expected values never come from a proposal:
# they name a frozen file already in the repository or a held-out value. Predicates for `finite` and `refuter`
# come from the proposal's checks.py, which is scanned (an allow-list of Python constructs) before it runs.
# Changing this file is a change to the verifier and needs the code owner's review.

required: [lean, vocabulary, nonvacuity]          # added by the verifier for every formalized theorem

claim_types:
  exact_statement:
    describe: An exact identity or inequality (e.g. a closed form, a bound with explicit constants).
    require_one_of: [[finite, refuter, equivalence]]
    allowed: [finite, refuter, equivalence]
  count_formula:
    describe: A resource count given by a formula in the problem size (qubits, vertices, gates, depth).
    require_one_of: [[finite, refuter]]
    allowed: [finite, refuter, equivalence, tool]
  resource_estimate:
    describe: A numerical resource estimate (physical qubits, runtime, T count) from a model or pipeline.
    require_one_of: [[tool, reproduction]]
    allowed: [tool, reproduction, finite, refuter, equivalence]
  logical_error_model:
    describe: A logical-error or threshold model for an error-correcting code.
    require_one_of: [[tool]]
    allowed: [tool, finite, refuter, equivalence]
    tools: [surface_code.memory, surface_code.fit]
  translation:
    describe: A gate-to-MBQC translation or compilation preserves the computation.
    require_one_of: [[finite, refuter]]
    allowed: [finite, refuter, equivalence]

params:
  finite:      {max_points: 1000000}
  refuter:     {source: hypothesis, min_examples: 200, max_examples: 20000}
  tool:        {max_shots: 1000000, max_distance: 11}
  equivalence: {}
  reproduction: {}

# Imports a proposal's checks.py may use (anything else is refused by the scan).
predicate_imports: [math, fractions, itertools, functools, mbqc_verify]
