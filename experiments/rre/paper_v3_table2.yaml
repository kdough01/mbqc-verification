# total modules 2·n^per-leg_modules, hardware t_tot, P_Diss,4K, P_Diss,20mK, E_tot. Values are in SI base units
# here (s, W, Wh); "printed" keeps the table's own text. Rows above 4x4 are for the larger machine (README.md).
